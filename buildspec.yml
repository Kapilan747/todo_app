version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - REPOSITORY_URI=824756206534.dkr.ecr.ap-south-2.amazonaws.com/kapilan_manual_ror_ecr
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_TAG=tf-ror-cp-${CODEBUILD_BUILD_NUMBER}
      - echo "Repository URI is $REPOSITORY_URI"
      - echo "Image tag is $IMAGE_TAG"

build:
  commands:
    - echo "Build started on $(date)"
    - echo "Building Docker image..."
    - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .

  post_build:
  commands:
    - echo "Build completed on $(date)"
    - docker push "$REPOSITORY_URI:$IMAGE_TAG"

    - echo '[{"name":"'"$ECS_CONTAINER_NAME"'","imageUri":"'"$REPOSITORY_URI:$IMAGE_TAG"'"}]' > imagedefinitions.json

    - ls -l imagedefinitions.json
    - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json 
