name: Upload Source To S3

on:
  push:
    branches:
      - terraform-ecs

permissions:
  id-token: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::618015514579:role/kapilan-tf-ror-gha-deploy-role
          aws-region: ap-south-2

      - name: Create source archive
        run: |
          zip -r source.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "log/*" \
            -x "tmp/*" \
            -x "vendor/bundle/*" \
            -x "node_modules/*" \
            -x "source.zip"

      - name: Upload source archive to S3
        run: |
          aws s3 cp source.zip \
            s3://kapilan-tf-ror-pipeline-artifacts-618015514579/source/source.zip
