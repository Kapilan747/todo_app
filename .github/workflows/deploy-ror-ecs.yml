name: Deploy RoR through AWS CodePipeline

on:
  push:
    branches:
      - terraform-ecs

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-2
  AWS_ROLE_ARN: arn:aws:iam::618015514579:role/kapilan-tf-ror-gha-deploy-role
  PIPELINE_SOURCE_BUCKET: kapilan-tf-ror-pipeline-artifacts-618015514579
  PIPELINE_SOURCE_KEY: source/source.zip
  CODEPIPELINE_NAME: kapilan-tf-ror-codepipeline

jobs:
  trigger-codepipeline:
    name: Upload source and start CodePipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create source zip
        run: |
          zip -r source.zip . \
            -x ".git/*" \
            -x "tmp/*" \
            -x "log/*" \
            -x "node_modules/*" \
            -x "vendor/bundle/*"

      - name: Upload source zip to S3
        run: |
          aws s3 cp source.zip "s3://${PIPELINE_SOURCE_BUCKET}/${PIPELINE_SOURCE_KEY}" \
            --region "$AWS_REGION"

      - name: Start CodePipeline
        run: |
          aws codepipeline start-pipeline-execution \
            --name "$CODEPIPELINE_NAME" \
            --region "$AWS_REGION"
